<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop OTP - Admin - TrenCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">

    <nav class="admin-sidebar" id="sidebar"></nav>

    <div class="admin-overlay" id="overlay"></div>

    <div class="admin-main">
        <div class="admin-topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <h5 class="page-title">Shop OTP</h5>
            </div>
            <button class="btn btn-sm btn-dark" onclick="loadShopOtps()">
                <i class="fas fa-sync-alt"></i> <span class="d-none d-md-inline">Refresh</span>
            </button>
        </div>

        <div class="admin-content">
            <div class="row g-3 mb-4">
                <div class="col-md-4 col-6">
                    <div class="admin-stat-card stat-accent-blue">
                        <div class="stat-value" id="otpCount">0</div>
                        <div class="stat-label">Latest Shop OTPs</div>
                    </div>
                </div>
            </div>

            <div class="admin-card">
                <div class="admin-card-header">
                    <h6>Latest 5 Shop OTPs</h6>
                </div>
                <div class="admin-card-body p-0">
                    <div class="admin-table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Shop Name</th>
                                    <th>Shop Email</th>
                                    <th>OTP</th>
                                    <th class="hide-mobile">Purpose</th>
                                    <th>Status</th>
                                    <th class="hide-mobile">Created</th>
                                    <th class="hide-mobile">Expires</th>
                                </tr>
                            </thead>
                            <tbody id="shopOtpTable">
                                <tr><td colspan="7" class="admin-loading"><div class="spinner-border spinner-border-sm"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/admin-common.js"></script>
    <script src="../assets/js/admin-shopotp.js"></script>
</body>
</html>
