<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Zones - Admin - TrenCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">

    <nav class="admin-sidebar" id="sidebar"></nav>
    <div class="admin-overlay" id="overlay"></div>

    <div class="admin-main">
        <div class="admin-topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <h5 class="page-title">Delivery Zones</h5>
            </div>
            <button class="btn btn-primary btn-sm" onclick="openZoneModal()">
                <i class="fas fa-plus"></i> <span class="d-none d-md-inline">Add Zone</span>
            </button>
        </div>

        <div class="admin-content">

            <!-- Zones Cards -->
            <div class="row g-3 mb-4" id="zonesGrid"></div>

            <!-- Pincodes Table -->
            <div class="admin-card">
                <div class="admin-card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h6 class="mb-0"><i class="fas fa-map-pin me-2"></i>Pincodes</h6>
                    <div class="d-flex gap-2 flex-wrap">
                        <select class="form-select form-select-sm" id="filterZone" onchange="loadPincodes()" style="width:auto;">
                            <option value="">All Zones</option>
                        </select>
                        <button class="btn btn-sm btn-outline-primary" onclick="openBulkModal()">
                            <i class="fas fa-upload me-1"></i>Bulk Add
                        </button>
                        <button class="btn btn-sm btn-primary" onclick="openPincodeModal()">
                            <i class="fas fa-plus me-1"></i>Add Pincode
                        </button>
                    </div>
                </div>
                <div class="admin-card-body p-0">
                    <div class="admin-table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Pincode</th>
                                    <th>Area</th>
                                    <th>Zone</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="pincodesTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Zone Modal -->
    <div class="modal fade" id="zoneModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="zoneModalTitle">Add Zone</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editZoneId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Zone Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="zoneName" placeholder="e.g. Zone 1 - Free Delivery">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Delivery Fee (₹)</label>
                        <input type="number" class="form-control" id="zoneDeliveryFee" value="0" min="0" step="0.01">
                        <div class="form-text">Set to 0 for free delivery</div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="zoneIsDefault">
                        <label class="form-check-label" for="zoneIsDefault">
                            Default zone <small class="text-muted">(applied when pincode is not found in any zone)</small>
                        </label>
                    </div>
                    <div class="mb-0 form-check">
                        <input type="checkbox" class="form-check-input" id="zoneIsActive" checked>
                        <label class="form-check-label" for="zoneIsActive">Active</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveZone()">Save Zone</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pincode Modal -->
    <div class="modal fade" id="pincodeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="pincodeModalTitle">Add Pincode</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editPincodeId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Pincode <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="pincodeValue" maxlength="6" placeholder="6-digit pincode">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Area Name</label>
                        <input type="text" class="form-control" id="pincodeArea" placeholder="e.g. Kazhakootam">
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-semibold">Zone <span class="text-danger">*</span></label>
                        <select class="form-select" id="pincodeZone"></select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="savePincode()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bulk Add Modal -->
    <div class="modal fade" id="bulkModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Bulk Add Pincodes</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Zone <span class="text-danger">*</span></label>
                        <select class="form-select" id="bulkZone"></select>
                    </div>
                    <div class="mb-0">
                        <label class="form-label fw-semibold">Pincodes</label>
                        <textarea class="form-control" id="bulkPincodes" rows="8"
                                  placeholder="One per line. Optionally add area name after colon:&#10;695582:Kazhakootam&#10;695581:Technopark&#10;695301"></textarea>
                        <div class="form-text">Supports comma, space, or newline separated pincodes. Duplicates are ignored.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveBulkPincodes()">Add Pincodes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/admin-common.js"></script>
    <script src="../assets/js/admin-delivery-zones.js"></script>
</body>
</html>
