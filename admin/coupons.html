<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupons - Admin - TrenCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">

    <nav class="admin-sidebar" id="sidebar"></nav>

    <div class="admin-overlay" id="overlay"></div>

    <div class="admin-main">
        <div class="admin-topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <h5 class="page-title">Coupons</h5>
            </div>
            <button class="btn btn-primary btn-sm" onclick="openCouponModal()">
                <i class="fas fa-plus"></i> <span class="d-none d-md-inline">Add Coupon</span>
            </button>
        </div>

        <div class="admin-content">
            <div class="admin-card">
                <div class="admin-card-header">
                    <h6>All Coupons</h6>
                </div>
                <div class="admin-card-body p-0">
                    <div class="admin-table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Code</th>
                                    <th>Discount</th>
                                    <th class="hide-mobile">Min Order</th>
                                    <th class="hide-mobile">Usage</th>
                                    <th class="hide-mobile">Valid</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="couponsTable">
                                <tr><td colspan="7" class="admin-loading"><div class="spinner-border spinner-border-sm"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Coupon Modal -->
    <div class="modal fade admin-modal" id="couponModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title" id="couponModalTitle"><i class="fas fa-ticket-alt me-2"></i>Add Coupon</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editCouponId">

                    <div class="mb-3">
                        <label class="form-label">Coupon Code *</label>
                        <input type="text" class="form-control text-uppercase" id="couponCode" placeholder="e.g. WELCOME20" style="text-transform:uppercase;">
                        <small class="text-muted" id="couponCodeHint">Letters, numbers, - and _ only. Cannot be changed after creation.</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text" class="form-control" id="couponDescription" placeholder="Shown to customers, optional">
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Discount Type *</label>
                            <select class="form-select" id="couponDiscountType" onchange="toggleCouponValueField()">
                                <option value="percentage">Percentage (%)</option>
                                <option value="fixed">Fixed Amount (₹)</option>
                                <option value="free_delivery">Free Delivery</option>
                            </select>
                        </div>
                        <div class="col-6" id="couponDiscountValueCol">
                            <label class="form-label">Discount Value *</label>
                            <input type="number" class="form-control" id="couponDiscountValue" min="0.01" step="0.01" required>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Max Discount (₹)</label>
                            <input type="number" class="form-control" id="couponMaxDiscount" min="0" step="0.01" placeholder="No cap">
                            <small class="text-muted">Caps a % discount. Leave blank for no cap.</small>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Min Order Value (₹)</label>
                            <input type="number" class="form-control" id="couponMinOrder" min="0" step="0.01" value="0">
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Total Usage Limit</label>
                            <input type="number" class="form-control" id="couponUsageTotal" min="1" placeholder="Unlimited">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Per-Customer Limit</label>
                            <input type="number" class="form-control" id="couponUsagePerUser" min="1" value="1">
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Valid From</label>
                            <input type="datetime-local" class="form-control" id="couponValidFrom">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Valid Until</label>
                            <input type="datetime-local" class="form-control" id="couponValidUntil">
                        </div>
                    </div>

                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="couponFirstOrderOnly">
                        <label class="form-check-label" for="couponFirstOrderOnly">First order only</label>
                        <div><small class="text-muted">Works only for customers who have not placed an order yet.</small></div>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="couponIsActive" checked>
                        <label class="form-check-label" for="couponIsActive">Active</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="saveCoupon()">
                        <i class="fas fa-save"></i> Save
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/admin-common.js"></script>
    <script src="../assets/js/admin-coupons.js"></script>
</body>
</html>
