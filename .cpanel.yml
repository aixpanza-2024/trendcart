---
# NOTE: this file is branch-specific. On the appaddon branch it deploys to
# a staging folder under aksuperspeciality.com, NOT the live production
# path — that's deliberate, so deploying this branch can never overwrite
# the live site. The repo clone path and DEPLOYPATH are the same folder
# here, so rsync (not cp) is used — cp -R errors when source == destination.
deployment:
  tasks:
    - export DEPLOYPATH=/home/notechin/aksuperspeciality.com/trencartapp
    - /usr/bin/rsync -a --exclude='.git' ./ "$DEPLOYPATH/"
